# 매 평일 오후 3시(KST)에 일별 종가를 받아 대시보드를 다시 만들고 GitHub Pages에 배포한다.
# 필요한 설정 (저장소 Settings):
#   - Secrets and variables > Actions > New repository secret: DATA_GO_KR_KEY (공공데이터포털 Decoding 인증키)
#   - Pages > Build and deployment > Source: GitHub Actions
name: daily-update

on:
  schedule:
    - cron: "0 6 * * 1-5"  # UTC 06:00 = KST 15:00 (종가는 다음 영업일 오후 1시 이후 공개)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write  # data/daily/*.csv 커밋
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # 수집 단계가 하나라도 실패하면 페이지는 배포하되 마지막에 실행을 실패로 표시한다 (GitHub가 메일을 보낸다)
      collect_failed: ${{ steps.roll.outcome == 'failure' || steps.prices.outcome == 'failure' || steps.votes.outcome == 'failure' || steps.official.outcome == 'failure' }}
    env:
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: nps_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nps_tracker/requirements.txt

      - run: pip install -r requirements.txt

      - name: 새 연말 공시 확인·적용 (roll_year)
        # 검증에 실패하면 아무것도 바꾸지 않는다. 기존 보유 기준으로 계속 진행한다
        id: roll
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python roll_year.py

      - name: 일별 종가 수집 (step6)
        # API가 잠시 불안정해도 이미 받은 데이터로 대시보드는 만든다
        id: prices
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python step6_daily_prices.py

      - name: 국내 의결권 행사내역 수집
        # 기금운용본부 홈페이지가 잠시 응답하지 않아도 나머지는 진행한다
        id: votes
        continue-on-error: true
        run: python fetch_votes.py

      - name: 국민연금 월말 국내주식 평가액 수집
        id: official
        continue-on-error: true
        run: python fetch_official.py

      - name: 일별 평가액·월별 검증·대시보드 (step7, step8, build)
        run: |
          python step7_daily_value.py
          python step8_monthly_check.py
          python build_dashboard.py

      - name: 새 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "새 데이터 없음"
          else
            git commit -m "data: 자동 갱신 $(date +%Y-%m-%d)"
            git pull --rebase --autostash -q
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nps_tracker/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: needs.build.outputs.collect_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "수집 단계가 실패했습니다. build 작업의 기록을 확인하세요. 페이지는 기존 데이터로 배포됐습니다."
          exit 1
