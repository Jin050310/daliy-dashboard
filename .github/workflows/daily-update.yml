# 매 평일 오후 3시(KST)에 일별 종가를 받아 대시보드를 다시 만들고 GitHub Pages에 배포한다.
# 필요한 설정 (저장소 Settings):
#   - Secrets and variables > Actions > New repository secret: DATA_GO_KR_KEY (공공데이터포털 Decoding 인증키)
#   - Pages > Build and deployment > Source: GitHub Actions
name: daily-update

on:
  schedule:
    - cron: "0 6 * * 1-5"  # UTC 06:00 = KST 15:00 (종가는 다음 영업일 오후 1시 이후 공개)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write  # data/daily/*.csv 커밋
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    defaults:
      run:
        working-directory: nps_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nps_tracker/requirements.txt

      - run: pip install -r requirements.txt

      - name: 일별 종가 수집 (step6)
        # API가 잠시 불안정해도 이미 받은 데이터로 대시보드는 만든다
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python step6_daily_prices.py

      - name: 일별 평가액·월별 검증·대시보드 (step7, step8, build)
        run: |
          python step7_daily_value.py
          python step8_monthly_check.py
          python build_dashboard.py

      - name: 새 종가 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          if git diff --cached --quiet; then
            echo "새 종가 없음"
          else
            git commit -m "data: 일별 종가 갱신 $(date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nps_tracker/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
